# A separate H2 database per Spring context; never uses development PostgreSQL.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# External integrations are disabled, not redirected to another local port.
app.redis.enabled=false
app.firebase.enabled=false
app.notifications.strategy=log
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt.secret=chave_exclusiva_de_testes_minimo_32_caracteres_aqui
jwt.expiration=86400000
file.upload-dir=./target/test-uploads
file.base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.chatapp=WARN
logging.file.name=target/test-logs/samuschat.log
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
