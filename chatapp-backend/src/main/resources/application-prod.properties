spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
app.redis.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
file.upload-dir=/app/uploads
file.base-url=${PUBLIC_BASE_URL}
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.notifications.strategy=${NOTIFICATION_STRATEGY:log}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.info.env.enabled=true
info.app.name=SamusChat
info.app.version=@project.version@

logging.level.com.chatapp=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{ISO8601} [%level] [${INSTANCE_ID:local}] %logger{20} - %msg%n
logging.file.name=/app/logs/samuschat.log
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
