# Loaded after prod only in the unified Render container.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=30

# One API instance uses the existing local STOMP broadcaster; no Redis service.
app.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.data.redis.host=localhost
spring.data.redis.password=
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false

# Only the Nginx process in this container can reach Java on loopback.
app.security.trusted-proxies=127.0.0.1
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.notifications.strategy=${NOTIFICATION_STRATEGY:log}
