spring.application.name=chatapp-backend
# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=postgres
spring.datasource.password=senha123

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=chatapp_chave_secreta_minimo_32_caracteres_aqui
jwt.expiration=86400000

# Porta do servidor
server.port=8080

# Upload de arquivos
file.upload-dir=./uploads
file.base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.chatapp=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20} - %msg%n
logging.file.name=logs/samuschat.log

# Seguranca adicional
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Timeout de conexao
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
