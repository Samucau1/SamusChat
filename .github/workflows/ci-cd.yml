name: SamusChat CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: chatapp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: chatapp-backend/pom.xml
      - name: Verify backend and Redis fan-out
        run: bash mvnw -B -ntp verify
        env:
          RUN_REDIS_TESTS: 'true'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: chatapp-backend/target/surefire-reports/
          retention-days: 7
      - name: Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: chatapp-backend/target/site/jacoco/
          retention-days: 7

  container-smoke:
    name: Production stack smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_USERNAME: local
      IMAGE_TAG: ci
      DB_USER: smoke
      DB_PASSWORD: smoke-database-only
      REDIS_PASSWORD: smoke-redis-only
      JWT_SECRET: smoke-jwt-secret-only-at-least-32-characters
      PUBLIC_BASE_URL: http://localhost:18080
      HTTP_PORT: '18080'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: chatapp-backend
          load: true
          tags: local/samuschat-backend:ci
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64
      - name: Validate scripts and Compose
        run: |
          bash -n scripts/deploy.sh
          docker compose -f docker-compose.prod.yml config --quiet
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Start three production instances on PostgreSQL
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240
      - name: Verify routing, migrations and shared uploads
        run: node scripts/smoke-test.mjs
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=150
      - name: Clean up isolated CI stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  build-and-push:
    name: Publish Docker image
    needs: [test, container-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          test -n "$DOCKER_USERNAME"
          echo "name=$DOCKER_USERNAME/samuschat-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: chatapp-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=backend-multiarch
          cache-to: type=gha,mode=max,scope=backend-multiarch

  deploy:
    name: Deploy production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: samuschat-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH and release configuration
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PRODUCTION_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: python3 scripts/prepare-release.py
      - name: Upload and deploy the exact commit
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/deploy_key" -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          release="/opt/samuschat/releases/$GITHUB_SHA"
          # The validated commit SHA intentionally expands on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "umask 077; mkdir -p '$release'"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/release.tar.gz" "$SERVER_USER@$SERVER_HOST:$release/release.tar.gz"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" "set -eu; cd '$release'; tar xzf release.tar.gz; rm release.tar.gz; bash scripts/deploy.sh"
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/release.tar.gz"
