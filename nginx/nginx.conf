worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Dynamic resolution follows container IP changes during a deployment.
    upstream samuschat_backend {
        zone api_upstream 64k;
        least_conn;
        server backend1:8080 resolve max_fails=3 fail_timeout=10s;
        server backend2:8080 resolve max_fails=3 fail_timeout=10s;
        server backend3:8080 resolve max_fails=3 fail_timeout=10s;
    }
    # SockJS fallback uses multiple HTTP requests for the same session.
    upstream samuschat_websocket {
        zone websocket_upstream 64k;
        ip_hash;
        server backend1:8080 resolve max_fails=3 fail_timeout=10s;
        server backend2:8080 resolve max_fails=3 fail_timeout=10s;
        server backend3:8080 resolve max_fails=3 fail_timeout=10s;
    }
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        client_max_body_size 11m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied forwarding headers at this trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://samuschat_backend;
        }
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://samuschat_backend;
        }
        location /ws {
            proxy_pass http://samuschat_websocket;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /uploads/ {
            proxy_pass http://samuschat_backend;
        }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { return 404; }
    }
}
